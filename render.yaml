services:
  - type: web
    name: persian-news-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: CHAT_ID
        sync: false
      - key: CHECK_INTERVAL_MIN
        value: "15"
      - key: MAX_ITEMS_PER_ROUND
        value: "12"
      - key: PYTHON_VERSION
        value: "3.12.7"
